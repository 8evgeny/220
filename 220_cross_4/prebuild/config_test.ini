# =============================================================================
#  ТЕСТОВЫЙ КОНФИГ: трекерный контур vdb_vrt_tracker_adapter
#
#  Содержит ВСЕ ключи секции [TrackerControl] со значениями по умолчанию,
#  как они заданы в SettingsManager::loadSettings() (src/app/settingsmanager.cpp).
#  Единственное отличие от дефолта: Use_Adapter=true — конфиг предназначен для
#  проверки НОВОГО контура (в коде при отсутствии ключа включён старый Pid).
#
#  Запуск:  qgst-goen220 <путь>/config_test.ini
#  Откат на старый контур: Use_Adapter=false (или удалить файл).
#
#  Индексы: Channel: TV (кадр 1920x1080, 0x80) | TPV = IR (640x512, 0x81)
#           Axis:    X = курс (yaw)             | Y   = тангаж (pitch)
#  Алгоритм: ошибка = dist_norm * FOV[°] → эксп.фильтр(0.85) →
#            PID (коэф. интерполируются по FOV между Wide/Tele) →
#            SlewRateLimiter → скорость ГП [°/с] со знаком −.
# =============================================================================

[General]

# ─── Общие параметры контура ────────────────────────────────────────────────
# true — новый адаптер; false (дефолт в коде) — старый Pid-контур
TrackerControl.Use_Adapter=true
# Период шага расчёта, мс (ограничен 5..200)
TrackerControl.Step_MS=20

# ─── TV канал (0x80) ────────────────────────────────────────────────────────
# Опорные точки FOV, град (широкий / теле)
TrackerControl.TV.Wide.FovVal=58.1
TrackerControl.TV.Tele.FovVal=0.19

# Базовый PID по осям. Kp X=2.5 / Y=1.25 — эквивалент старого контура
# (Kp 0.05/0.025 × масштаб kW=-50). Выход ограничен OutLim, °/с.
TrackerControl.TV.X.Kp=2.5
TrackerControl.TV.X.Ki=0.0
TrackerControl.TV.X.Kd=0.0
TrackerControl.TV.X.ILim=1.0
TrackerControl.TV.X.OutLim=20.0
TrackerControl.TV.Y.Kp=1.25
TrackerControl.TV.Y.Ki=0.0
TrackerControl.TV.Y.Kd=0.0
TrackerControl.TV.Y.ILim=1.0
TrackerControl.TV.Y.OutLim=20.0

# Множители PID в опорной точке Wide (1.0 = без изменения базового коэф.)
TrackerControl.TV.Wide.X.kKp=1.0
TrackerControl.TV.Wide.X.kKi=1.0
TrackerControl.TV.Wide.X.kKd=1.0
TrackerControl.TV.Wide.X.kKiLim=1.0
TrackerControl.TV.Wide.Y.kKp=1.0
TrackerControl.TV.Wide.Y.kKi=1.0
TrackerControl.TV.Wide.Y.kKd=1.0
TrackerControl.TV.Wide.Y.kKiLim=1.0

# Множители PID в опорной точке Tele
TrackerControl.TV.Tele.X.kKp=1.0
TrackerControl.TV.Tele.X.kKi=1.0
TrackerControl.TV.Tele.X.kKd=1.0
TrackerControl.TV.Tele.X.kKiLim=1.0
TrackerControl.TV.Tele.Y.kKp=1.0
TrackerControl.TV.Tele.Y.kKi=1.0
TrackerControl.TV.Tele.Y.kKd=1.0
TrackerControl.TV.Tele.Y.kKiLim=1.0

# ─── TPV / IR канал (0x81) ──────────────────────────────────────────────────
TrackerControl.TPV.Wide.FovVal=26.99
TrackerControl.TPV.Tele.FovVal=2.75

TrackerControl.TPV.X.Kp=2.5
TrackerControl.TPV.X.Ki=0.0
TrackerControl.TPV.X.Kd=0.0
TrackerControl.TPV.X.ILim=1.0
TrackerControl.TPV.X.OutLim=20.0
TrackerControl.TPV.Y.Kp=1.25
TrackerControl.TPV.Y.Ki=0.0
TrackerControl.TPV.Y.Kd=0.0
TrackerControl.TPV.Y.ILim=1.0
TrackerControl.TPV.Y.OutLim=20.0

TrackerControl.TPV.Wide.X.kKp=1.0
TrackerControl.TPV.Wide.X.kKi=1.0
TrackerControl.TPV.Wide.X.kKd=1.0
TrackerControl.TPV.Wide.X.kKiLim=1.0
TrackerControl.TPV.Wide.Y.kKp=1.0
TrackerControl.TPV.Wide.Y.kKi=1.0
TrackerControl.TPV.Wide.Y.kKd=1.0
TrackerControl.TPV.Wide.Y.kKiLim=1.0

TrackerControl.TPV.Tele.X.kKp=1.0
TrackerControl.TPV.Tele.X.kKi=1.0
TrackerControl.TPV.Tele.X.kKd=1.0
TrackerControl.TPV.Tele.X.kKiLim=1.0
TrackerControl.TPV.Tele.Y.kKp=1.0
TrackerControl.TPV.Tele.Y.kKi=1.0
TrackerControl.TPV.Tele.Y.kKd=1.0
TrackerControl.TPV.Tele.Y.kKiLim=1.0
